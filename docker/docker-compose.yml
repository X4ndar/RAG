name: rag-saas

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ragnet]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [ragnet]

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ragnet]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_CACHE_DIR: /app/.cache/embeddings
      STORAGE_DIR: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      # Dev bind mount: host edits to ./backend show up in the container
      # immediately, so code changes don't require rebuilding the image.
      # The prod override nulls this out; see docker-compose.prod.yml.
      - ../backend:/app
      # Anonymous volume guards against a stray host-side venv (e.g. created
      # by `uv sync` during local tooling) bleeding into the container. The
      # real container venv lives at /opt/venv, not here.
      - /app/.venv
      # Shared BGE-M3 weights (~2 GB). Also mounted on the worker so the
      # worker doesn't re-download.
      - embedding_cache:/app/.cache/embeddings
      # Shared uploaded-PDF storage, readable by the worker.
      - document_storage:/app/storage
    networks: [ragnet]

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rag-worker
    restart: unless-stopped
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    env_file: ../.env
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_CACHE_DIR: /app/.cache/embeddings
      STORAGE_DIR: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Same dev bind-mount pattern as the backend: host code edits show up
      # after `docker compose restart worker`, no image rebuild needed. The
      # prod override strips these.
      - ../backend:/app
      - /app/.venv
      - embedding_cache:/app/.cache/embeddings
      - document_storage:/app/storage
    networks: [ragnet]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    networks: [ragnet]

volumes:
  pgdata:
  qdrant_data:
  redis_data:
  embedding_cache:
  document_storage:

networks:
  ragnet:
    driver: bridge
