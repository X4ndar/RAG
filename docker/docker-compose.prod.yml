name: rag-saas

# Production override stub. Apply with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Tighten this before any real deploy: remove published Postgres/Qdrant/Redis
# ports, front the backend and frontend behind Caddy or Nginx with TLS, and
# move secrets into a proper secret store (Docker secrets, Vault, etc).

services:
  postgres:
    ports: []
    restart: always

  qdrant:
    ports: []
    restart: always

  redis:
    ports: []
    restart: always

  backend:
    restart: always
    environment:
      APP_ENV: production
    # Strip the dev bind mount + anon .venv; keep the data volumes prod
    # actually needs. `!reset` alone clears the base list; we then list
    # only the mounts we want.
    volumes: !override
      - embedding_cache:/app/.cache/embeddings
      - document_storage:/app/storage
    # ports: []  # uncomment once a reverse proxy is in front

  worker:
    restart: always
    environment:
      APP_ENV: production
    # Same rationale as backend: strip the dev bind mount + anon .venv,
    # keep the data volumes.
    volumes: !override
      - embedding_cache:/app/.cache/embeddings
      - document_storage:/app/storage

  frontend:
    restart: always
    # ports: []  # uncomment once a reverse proxy is in front

