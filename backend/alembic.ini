[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

# Post-write hooks disabled in-image: black/ruff are dev-only deps and the
# production image doesn't carry them. Format and lint migrations from the
# host before committing: `cd backend && uv run black app/db/migrations
# && uv run ruff check --fix app/db/migrations`.
# [post_write_hooks]
# hooks = black,ruff
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = check --fix

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
