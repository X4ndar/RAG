[project]
name = "rag-saas-backend"
version = "0.0.1"
description = "Multi-tenant RAG SaaS backend (FastAPI, SQLAlchemy async, Pydantic v2)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "X4ndar" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "httpx>=0.28",
    "arq>=0.26,<0.27",
    "docling>=2.0",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.12",
    "python-magic>=0.4",
    "transformers>=4.44",
    "cryptography>=42",
    # pydantic-ai-slim with per-provider extras instead of the umbrella
    # `pydantic-ai`. The umbrella pulls anthropic SDK pins that have
    # already drifted out of compatibility with the installed
    # transitive dep tree; the slim package gives us deterministic
    # installs scoped to the providers we ship.
    # pydantic-ai-slim 1.0–1.1 referenced anthropic SDK symbols that have
    # since been removed; 1.85+ tracks the current SDKs cleanly. Cap at <2
    # because the 2.x release line will be a separate breaking-change
    # decision for V1.5b.
    "pydantic-ai-slim[anthropic,openai,google,mistral]>=1.85,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "N", "RET", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Upload route touches pathlib for a tmpfile cleanup block; the syscalls
# are fast enough that hopping to anyio.Path is not worth the dep.
"app/api/v1/documents.py" = ["ASYNC240"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped event loop. Required for the session-scoped `host_engine`
# fixture in tests/integration/conftest.py — without this, asyncpg pooled
# connections get bound to a per-test loop and the second integration
# test fails on "Future attached to a different loop" during teardown.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing -p no:logfire"
testpaths = ["tests"]
